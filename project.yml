# XcodeGen spec for the Lungful App Store target.
#
# Generate the Xcode project with:
#   brew install xcodegen   (once)
#   xcodegen generate
# then open Lungful.xcodeproj, set your signing team, and archive.
#
# The generated .xcodeproj is disposable — project.yml is the source of truth.
# Add Lungful.xcodeproj to .gitignore if you prefer, or commit it; either works.

name: Lungful

options:
  bundleIdPrefix: dev.halfday
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LungfulPackage:
    path: .

targets:
  # Named LungfulApp (not Lungful) to avoid a build-system collision with the
  # Swift package's library product, which is also named "Lungful".
  # PRODUCT_NAME below keeps the built app bundle as Lungful.app.
  LungfulApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: LungfulPackage
        product: Lungful
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: lungful
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Lungful
        # App bundle stays Lungful.app, but the app's Swift module must not
        # be named "Lungful" — that collides with the package library's
        # .swiftmodule in Build/Products.
        PRODUCT_MODULE_NAME: LungfulApp
        PRODUCT_BUNDLE_IDENTIFIER: dev.halfday.lungful
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: true
